<form>
	<div class="mb-3 row">
		<label for="table-complete-search" class="col-xs-3 col-sm-auto col-form-label">Buscar:</label>
		<div class="col-xs-3 col-sm-auto">
			<input
				id="table-complete-search"
				type="text"
				class="form-control"
				name="searchTerm"
				[(ngModel)]="service.searchTerm"
			/>
		</div>
		@if (service.loading$ | async) {
			<span class="col col-form-label">Cargando...</span>
		}
	</div>

	<table class="table table-striped">
		<thead>
			<tr>
				<th scope="col">#</th>
				<th scope="col" sortable="nombre" (sort)="onSort($event)">Nombre</th>
				<th scope="col" sortable="apellidos" (sort)="onSort($event)">apellidos</th>
				<th scope="col" sortable="email" (sort)="onSort($event)">email</th>
                <th scope="col" sortable="fecha" (sort)="onSort($event)">fecha</th>
                <th scope="col" sortable="password" (sort)="onSort($event)">password</th>
			</tr>
		</thead>
		<tbody>
			@for (country of countries$ | async; track country.id) {
				<tr>
					<th scope="row">{{ country.id }}</th>
                    <td><ngb-highlight [result]="country.nombre" [term]="service.searchTerm" /></td>
					<td><ngb-highlight [result]="country.apellidos" [term]="service.searchTerm" /></td>
					<td><ngb-highlight [result]="country.email" [term]="service.searchTerm" /></td>
                    <td><ngb-highlight [result]="country.fecha" [term]="service.searchTerm" /></td>
                    <td><ngb-highlight [result]="country.password" [term]="service.searchTerm" /></td>
				</tr>
			} @empty {
				<tr>
					<td colspan="4" style="text-align: center">Usuarios no encontrados</td>
				</tr>
			}
		</tbody>
	</table>

	<div class="d-flex justify-content-between p-2">
		<ngb-pagination [collectionSize]="(total$ | async)!" [(page)]="service.page" [pageSize]="service.pageSize">
		</ngb-pagination>

		<select class="form-select" style="width: auto" name="pageSize" [(ngModel)]="service.pageSize">
			<option [ngValue]="2">2 usuarios por página</option>
			<option [ngValue]="4">4 usuarios por página</option>
			<option [ngValue]="6">6 usuarios por página</option>
		</select>
	</div>
</form>
