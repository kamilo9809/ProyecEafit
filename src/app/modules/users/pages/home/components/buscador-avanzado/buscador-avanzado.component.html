<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="mt-4 rounded-5 p-3 mb-3" style="background-color: #ececec">
    <div class="d-flex gap-3">
      <div
        class="d-flex border-end border-black gap-4 align-items-center ps-2"
        style="width: 40%"
      >
        <img src="{{ datos.imagen }}" alt="imagen de perfil" />
        <div>
          <h2 class="fs-5">{{ datos.nombre }}</h2>
          <p>{{ datos.rol }}</p>
        </div>
      </div>
      <div class="d-flex align-items-center w-50 position-relative">
        <input
          class="w-100 rounded-3 border-0 icon"
          placeholder="Buscar"
          type="text"
          #search
          [(ngModel)]="searchValue"
          name="search"
          [ngModelOptions]="{ standalone: true }"
        />
        <button
          *ngIf="searchValue"
          class="clear-input cursor-pointer position-absolute end-0 border-0 bg-transparent"
          (click)="clearInput()"
        >
          ❌
        </button>
      </div>
      <div class="d-flex gap-2" style="width: 10%">
        <img
          src="assets/iconoCampana.svg"
          alt="icono de campana"
          width="25px"
        />
        <img src="assets/iconoMensaje.svg" alt="icono mensaje" width="25px" />
      </div>
    </div>

    <div *ngIf="searchValue">
      <div class="row">
        <div class="col d-flex flex-column">
          <label for="">Rango de fechas</label>
          <div class="d-flex gap-4">
            <input
              formControlName="fechaInicio"
              type="date"
              [ngClass]="stylesClassDropdown"
              [style]="stylesDropdown"
            />
            <span class="mt-3">a</span>
            <input
              formControlName="fechaFinal"
              type="date"
              [ngClass]="stylesClassDropdown"
              [style]="stylesDropdown"
            />
          </div>
        </div>
        <div class="col d-flex flex-column">
          <label for="ubication">Ubicacion</label>
          <select
            formControlName="ubicacion"
            name="ubication"
            id="ubication"
            [ngClass]="stylesClassDropdown"
            [style]="stylesDropdown"
          >
            <option disabled selected value="">Elija una ciudad</option>
            <option
              *ngFor="let item of dropdownCiudadObject; let i = index"
              value="{{ item.ciudad }}"
            >
              {{ item.ciudad }}
            </option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-5">
          <label for="oportunidad">Tipo de oportunidad</label>
          <select
            formControlName="oportunidad"
            name="oportunidad"
            id="oportunidad"
            [ngClass]="stylesClassDropdown"
            [style]="stylesDropdown"
          >
            <option disabled selected value="">Elija una oportunidad</option>
            <option
              *ngFor="let item of dropdownOportunidad; let i = index"
              [value]="item.Oportunidad"
            >
              {{ item.Oportunidad }}
            </option>
          </select>
        </div>
        <div class="col-3">
          <label for="sector">Sector</label>
          <select
            formControlName="sector"
            name="sector"
            id="sector"
            [ngClass]="stylesClassDropdown"
            [style]="stylesDropdown"
          >
            <option disabled selected value="">Elija un sector</option>
            <option
              *ngFor="let item of dropdownSector; let i = index"
              [value]="item.sector"
            >
              {{ item.sector }}
            </option>
          </select>
        </div>
        <div class="mt-4 d-flex gap-3 col-4">
          <button
            class="{{ buttonStyle }} text-black"
            style="background-color: #d9d9d9"
            (click)="clearFind()"
          >
            Limpiar
          </button>
          <button
            class="{{ buttonStyle }} text-white"
            style="background-color: #00001a"
            type="submit"
            [disabled]="form.invalid"
          >
            Buscar
          </button>
        </div>
      </div>
    </div>
  </div>
</form>

<div
  *ngIf="searchValue"
  class="mt-4 rounded-5 p-3 mb-3 overflowHeight"
  style="background-color: #ececec"
>
  <div
    class="row"
    style="background-color: DCDCDC"
    *ngFor="let item of filterOportunity; let i = index"
  >
    <div class="col-3 my-4">
      <img
        src="{{ item.foto }}"
        alt="foto oportunidad"
        class="w-100 h-100 rounded-4 object-fit-cover"
      />
    </div>
    <div class="col-9">
      <h2>{{ item.titulo }}</h2>
      <p>
        {{ showFullText[i] ? fullText[i] : shortText[i] }}
        <span
          class="text-warning fw-bold cursor-pointer"
          (click)="toggleText(i)"
        >
          {{ showFullText[i] ? "ver menos" : "ver más" }}
        </span>
      </p>
      <div class="d-flex justify-content-end gap-3">
        <button class="{{ buttonContainerStyle }} border-dark ">
          Ver mas...
        </button>
        <button
          [ngClass]="{ active: isActive[i] }"
          class="{{ buttonContainerStyle }} border-success "
          (click)="toggleActive(i)"
        >
          Guardar
        </button>
      </div>
    </div>
  </div>
</div>
