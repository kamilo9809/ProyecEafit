<div id="chat-bot">
    <div id="chat-header">
        <img src="assets/LogoFATV.png" alt="Logo Fundación Antivirus" id="chat-logo">
        <h3>Fundación Antivirus</h3>
    </div>
    <div id="chat-messages">
        <div >
            <p *ngFor="let message of chat; let i = index">
                {{message.message}}
            </p>
        </div>
        <div *ngFor="let message of chatUser; let i = index">
            <span>
                {{message.message}}
            </span>
        </div>
    </div>
    <div class="d-flex">
        <div id="chat-input-container">
            <div id="chat-input" >
                <input type="text" #data id="user-input" placeholder="Escribe un mensaje">
                <button id="send-button"></button>
            </div>
        </div>
        <div class="d-flex align-contents-center">
            <button class="border-0" (click)="send()">
                <img src="assets/Icono-enviar.svg" alt="Icono Enviar">
            </button>
        </div>
    </div>
</div>
