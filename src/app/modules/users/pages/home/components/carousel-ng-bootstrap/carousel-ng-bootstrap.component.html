@if (images) {
<ngb-carousel>
  <ng-template ngbSlide class=" w-100">
    <div class="picsum-img-wrapper w-100">
      <img [src]="images[0]" alt="Random first slide" [class]="estilos" />
    </div>
  </ng-template>
  <ng-template ngbSlide>
    <div class="picsum-img-wrapper">
      <img [src]="images[1]" alt="Random second slide" [class]="estilos" />
    </div>
  </ng-template>
  <ng-template ngbSlide>
    <div class="picsum-img-wrapper">
      <img [src]="images[2]" alt="Random third slide" [class]="estilos" />
    </div>
  </ng-template>
</ngb-carousel>
}
